version: 2
updates:
  # Workflows pin actions to commit SHAs; this keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /Rust/QuotaBarCore
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: build
