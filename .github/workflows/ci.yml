name: CI

# Only PRs run CI. main takes squash merges of PRs that passed these checks while up to date
# with main. Documentation-only changes skip builds without changing required check names.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the complete PR diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          build="$(bash Scripts/ci_requires_build.sh "$BASE_SHA" HEAD)"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    # Report classification failures through the existing required checks too.
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15 compiles the pre-macOS 27 SDK path; xcode-27 builds what releases ship.
        os: [macos-15, xcode-27]
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful classification
        env:
          RESULT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
        run: |
          set -euo pipefail
          [[ "$RESULT" == success && ( "$BUILD" == true || "$BUILD" == false ) ]]
          if [[ "$BUILD" == false ]]; then
            echo "Documentation-only PR: compilation and packaging are not needed."
          fi

      - name: Check out source
        if: ${{ needs.changes.outputs.build == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print tool versions
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Run tests
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: make test

      # Release tags are permanent, so a broken packaging script must fail here, not on a tag.
      - name: Package app
        if: ${{ needs.changes.outputs.build == 'true' && matrix.os == 'xcode-27' }}
        run: |
          set -euo pipefail
          make app
          codesign --verify --deep --strict build/QuotaBar.app
