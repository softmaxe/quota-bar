name: CI

# Only PRs run CI. main takes squash merges of PRs that passed these checks while up to date
# with main, so each main commit is a tree CI already tested.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15 compiles the pre-macOS 27 SDK path; xcode-27 builds what releases ship.
        os: [macos-15, xcode-27]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print tool versions
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Run tests
        run: make test

      # Release tags are permanent, so a broken packaging script must fail here, not on a tag.
      - name: Package app
        if: ${{ matrix.os == 'xcode-27' }}
        run: |
          set -euo pipefail
          make app
          codesign --verify --deep --strict build/QuotaBar.app
