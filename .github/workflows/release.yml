name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build arm64
    runs-on: xcode-27
    env:
      ARCH: arm64
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate tap publishing credentials
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "${TAP_GITHUB_TOKEN:-}" ]]; then
            echo "::error::TAP_GITHUB_TOKEN is required to publish the Homebrew cask."
            exit 1
          fi

      - name: Verify native runner architecture
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          echo "Runner architecture: ${actual_arch}"
          echo "Expected architecture: ${ARCH}"
          if [[ "${actual_arch}" != "${ARCH}" ]]; then
            echo "::error::The runner architecture does not match the requested native architecture."
            exit 1
          fi

      - name: Print tool versions
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the native menu bar SDK
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "${sdk_version%%.*}" -lt 27 ]]; then
            echo "::error::Release builds require the macOS 27 SDK for native menu bar sessions."
            exit 1
          fi

      - name: Resolve version and archive name
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "tag" ]]; then
            if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must match ^v[0-9]+.[0-9]+.[0-9]+$."
              exit 1
            fi
            version="${REF_NAME#v}"
            archive_base="QuotaBar-${version}-macos-${ARCH}"
          else
            version="0.0.0"
            short_sha="${COMMIT_SHA:0:7}"
            archive_base="QuotaBar-dev-${short_sha}-macos-${ARCH}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive_base=${archive_base}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: make test

      - name: Package app
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION}" make app

      - name: Verify app signature, version, and architecture
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          app="build/QuotaBar.app"
          info_plist="${app}/Contents/Info.plist"
          [[ -d "${app}" ]]
          [[ -f "${info_plist}" ]]

          codesign --verify --deep --strict "${app}"

          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${info_plist}")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${info_plist}")"
          if [[ "${short_version}" != "${EXPECTED_VERSION}" || "${bundle_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::Info.plist version does not match ${EXPECTED_VERSION}."
            exit 1
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${info_plist}")"
          binary="${app}/Contents/MacOS/${executable}"
          [[ -f "${binary}" ]]
          architectures="$(lipo -archs "${binary}")"
          if [[ "${architectures}" != "${ARCH}" ]]; then
            echo "::error::The app contains architectures '${architectures}', expected exactly '${ARCH}'."
            exit 1
          fi

      - name: Archive app and create checksum
        env:
          ARCHIVE_BASE: ${{ steps.metadata.outputs.archive_base }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          zip_path="dist/${ARCHIVE_BASE}.zip"
          ditto -c -k --keepParent build/QuotaBar.app "${zip_path}"
          unzip -t "${zip_path}"

          zip_name="$(basename "${zip_path}")"
          (
            cd dist
            shasum -a 256 "${zip_name}" > "${zip_name}.sha256"
          )

          checksum_path="${zip_path}.sha256"
          line_count="$(wc -l < "${checksum_path}")"
          if [[ "${line_count}" -ne 1 ]]; then
            echo "::error::Checksum file must contain exactly one line."
            exit 1
          fi
          read -r checksum_digest checksum_reference < "${checksum_path}"
          if [[ "${checksum_reference}" != "${zip_name}" ]]; then
            echo "::error::Checksum must reference the archive basename only."
            exit 1
          fi
          if [[ ! "${checksum_digest}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Checksum is not a SHA-256 digest."
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            dist/${{ steps.metadata.outputs.archive_base }}.zip
            dist/${{ steps.metadata.outputs.archive_base }}.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 1 || 14 }}

  release:
    name: Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist

      - name: Validate tag and release packages
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match ^v[0-9]+.[0-9]+.[0-9]+$."
            exit 1
          fi
          version="${TAG#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          zip_name="QuotaBar-${version}-macos-arm64.zip"
          for expected_file in "dist/${zip_name}" "dist/${zip_name}.sha256"; do
            if [[ ! -f "${expected_file}" ]]; then
              echo "::error::Missing expected release asset: ${expected_file}"
              exit 1
            fi
          done
          (
            cd dist
            sha256sum -c "${zip_name}.sha256"
          )

      - name: Ensure tag has no existing release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A release already exists for $GITHUB_REF_NAME; refusing to overwrite it."
            exit 1
          fi

          api_output="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/$GITHUB_REF_NAME" 2>&1 || true)"
          status_line="$(printf '%s\n' "${api_output}" | sed -n '1p')"
          if [[ "${status_line}" != *404* ]]; then
            echo "::error::Could not confirm that no release exists for $GITHUB_REF_NAME."
            exit 1
          fi

      # gh uploads assets to a draft and publishes it only after every upload succeeds.
      - name: Publish release
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/QuotaBar-${VERSION}-macos-arm64.zip" \
            "dist/QuotaBar-${VERSION}-macos-arm64.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "QuotaBar ${VERSION}"

  bump-tap:
    name: Update Homebrew tap
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: release
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Update Homebrew
        run: brew update

      - name: Update tap cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_DEVELOPER: "1"
        run: |
          set -euo pipefail
          if [[ -z "${TAP_GITHUB_TOKEN:-}" ]]; then
            echo "::error::TAP_GITHUB_TOKEN is required to publish the Homebrew cask." >&2
            echo "Create a fine-grained PAT limited to softmaxe/homebrew-tap with Contents: read and write, and add it as TAP_GITHUB_TOKEN in softmaxe/quota-bar settings." >&2
            exit 1
          fi

          version="${TAG#v}"
          echo "Bump tap to $version ($TAG)"

          tmp_tap="$(mktemp -d)"
          tmp_dist="$(mktemp -d)"
          trap 'rm -rf "$tmp_tap" "$tmp_dist"' EXIT

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/softmaxe/homebrew-tap.git" "$tmp_tap"

          # Fetch from the same public download URL the cask uses. The API's by-tag release lookup
          # can serve a cached copy without assets right after publishing.
          zip_name="QuotaBar-${version}-macos-arm64.zip"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$tmp_dist/${zip_name}.sha256" \
            "https://github.com/softmaxe/quota-bar/releases/download/${TAG}/${zip_name}.sha256"
          cat "$tmp_dist"/*.sha256

          sha="$(awk -v n="$zip_name" '$2 == n { print $1 }' "$tmp_dist"/*.sha256)"
          if [[ -z "$sha" ]]; then
            echo "::error::Missing SHA-256 for $zip_name" >&2
            exit 1
          fi

          cask="$tmp_tap/Casks/quota-bar.rb"

          python3 - "$cask" "$version" "$sha" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          version, sha = sys.argv[2:4]
          text = path.read_text()
          for pattern, replacement in (
              (r'^  version "[^"]+"$', f'  version "{version}"'),
              (r'^  sha256 "[^"]+"$', f'  sha256 "{sha}"'),
          ):
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  sys.exit(f"Cask line not found: {pattern}")
          path.write_text(text)
          PY

          echo "--- updated cask ---"
          cat "$cask"

          # Developer mode turns deprecated cask DSL calls into errors.
          brew info --cask "$cask"
          brew fetch --cask "$cask"

          git -C "$tmp_tap" config user.name "github-actions[bot]"
          git -C "$tmp_tap" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$tmp_tap" add Casks/quota-bar.rb
          if git -C "$tmp_tap" diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -C "$tmp_tap" commit -m "chore: bump quota-bar to ${version}"
          # Handle concurrent pushes to the tap (e.g., other formula bumps) by rebasing and retrying.
          for attempt in 1 2 3; do
            if git -C "$tmp_tap" push origin main; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to push tap after 3 attempts."
              exit 1
            fi
            echo "Push rejected, rebasing tap and retrying (attempt $attempt)..."
            sleep $((attempt * 2))
            git -C "$tmp_tap" fetch origin main
            git -C "$tmp_tap" rebase origin/main
          done
