name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Runs beside the build so a bad tag or missing credential stops the release before it publishes.
  preflight:
    name: Preflight
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The environment only admits v*.*.* tags, which scopes the tap token to releases.
    environment: homebrew-tap
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a vMAJOR.MINOR.PATCH tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match ^v[0-9]+.[0-9]+.[0-9]+$."
            exit 1
          fi

      - name: Require the tag to point at a commit on main
        run: |
          set -euo pipefail
          # "behind" or "identical" means the tagged commit is already part of main.
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          if [[ "${status}" != "behind" && "${status}" != "identical" ]]; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main (compare status: ${status})."
            exit 1
          fi

      # An expired or revoked token would otherwise fail only after the immutable release is out.
      - name: Validate tap publishing credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          hint="Create a fine-grained PAT limited to softmaxe/homebrew-tap with Contents: read and write, and add it as HOMEBREW_TAP_TOKEN in the homebrew-tap environment of softmaxe/quota-bar."
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required to publish the Homebrew cask."
            echo "${hint}"
            exit 1
          fi

          # A dry-run push still opens git-receive-pack, which GitHub admits only with write access.
          tap_dir="$(mktemp -d)"
          git clone --quiet --depth 1 https://github.com/softmaxe/homebrew-tap.git "${tap_dir}"
          remote="https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/softmaxe/homebrew-tap.git"
          if ! git -C "${tap_dir}" -c credential.helper= push --dry-run "${remote}" HEAD:main; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot push to softmaxe/homebrew-tap; it may be expired or revoked."
            echo "${hint}"
            exit 1
          fi

  build:
    name: Build arm64
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ARCH: arm64
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Print tool versions
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the native menu bar SDK
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "${sdk_version%%.*}" -lt 27 ]]; then
            echo "::error::Release builds require the macOS 27 SDK for native menu bar sessions."
            exit 1
          fi

      - name: Resolve version and archive name
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "tag" ]]; then
            version="${REF_NAME#v}"
            archive_base="QuotaBar-${version}-macos-${ARCH}"
          else
            version="0.0.0"
            short_sha="${COMMIT_SHA:0:7}"
            archive_base="QuotaBar-dev-${short_sha}-macos-${ARCH}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive_base=${archive_base}" >> "${GITHUB_OUTPUT}"

      # No test step: preflight admits only tags on main, and every main commit is a squash of a PR
      # whose up-to-date tree already passed CI on this runner.
      - name: Package app
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION}" make app

      - name: Verify app signature, version, and architecture
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          app="build/QuotaBar.app"
          info_plist="${app}/Contents/Info.plist"
          [[ -d "${app}" ]]
          [[ -f "${info_plist}" ]]

          codesign --verify --deep --strict "${app}"

          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${info_plist}")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${info_plist}")"
          if [[ "${short_version}" != "${EXPECTED_VERSION}" || "${bundle_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::Info.plist version does not match ${EXPECTED_VERSION}."
            exit 1
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${info_plist}")"
          binary="${app}/Contents/MacOS/${executable}"
          [[ -f "${binary}" ]]
          architectures="$(lipo -archs "${binary}")"
          if [[ "${architectures}" != "${ARCH}" ]]; then
            echo "::error::The app contains architectures '${architectures}', expected exactly '${ARCH}'."
            exit 1
          fi

      - name: Archive app and create checksum
        env:
          ARCHIVE_BASE: ${{ steps.metadata.outputs.archive_base }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          zip_path="dist/${ARCHIVE_BASE}.zip"
          ditto -c -k --keepParent build/QuotaBar.app "${zip_path}"
          unzip -t "${zip_path}"

          (
            cd dist
            shasum -a 256 "${ARCHIVE_BASE}.zip" > "${ARCHIVE_BASE}.zip.sha256"
          )

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/${{ steps.metadata.outputs.archive_base }}.zip
            dist/${{ steps.metadata.outputs.archive_base }}.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 1 || 14 }}

  release:
    name: Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Validate release packages
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          zip_name="QuotaBar-${version}-macos-arm64.zip"
          for expected_file in "dist/${zip_name}" "dist/${zip_name}.sha256"; do
            if [[ ! -f "${expected_file}" ]]; then
              echo "::error::Missing expected release asset: ${expected_file}"
              exit 1
            fi
          done
          (
            cd dist
            sha256sum -c "${zip_name}.sha256"
          )

      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/QuotaBar-${{ steps.metadata.outputs.version }}-macos-arm64.zip

      # gh uploads assets to a draft and publishes it only after every upload succeeds.
      - name: Publish release
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/QuotaBar-${VERSION}-macos-arm64.zip" \
            "dist/QuotaBar-${VERSION}-macos-arm64.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "QuotaBar ${VERSION}"

  tap-sync:
    name: Update Homebrew tap
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: release
    runs-on: macos-15
    timeout-minutes: 20
    environment: homebrew-tap
    concurrency:
      group: homebrew-tap-quota-bar
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      TAP_DIR: ${{ github.workspace }}/homebrew-tap
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_DEVELOPER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Update Homebrew
        run: brew update

      # The tap is public, so it is cloned without credentials; the tap token is
      # exposed only to the final push step, never to Homebrew.
      - name: Update tap cask
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "Bump tap to $version ($TAG)"

          tmp_dist="$(mktemp -d)"
          trap 'rm -rf "$tmp_dist"' EXIT

          git clone https://github.com/softmaxe/homebrew-tap.git "$TAP_DIR"

          # Fetch from the same public download URL the cask uses. The API's by-tag release lookup
          # can serve a cached copy without assets right after publishing.
          zip_name="QuotaBar-${version}-macos-arm64.zip"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$tmp_dist/${zip_name}.sha256" \
            "https://github.com/softmaxe/quota-bar/releases/download/${TAG}/${zip_name}.sha256"
          cat "$tmp_dist"/*.sha256

          sha="$(awk -v n="$zip_name" '$2 == n { print $1 }' "$tmp_dist"/*.sha256)"
          if [[ -z "$sha" ]]; then
            echo "::error::Missing SHA-256 for $zip_name" >&2
            exit 1
          fi

          cask="$TAP_DIR/Casks/quota-bar.rb"

          python3 - "$cask" "$version" "$sha" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          version, sha = sys.argv[2:4]
          text = path.read_text()
          for pattern, replacement in (
              (r'^  version "[^"]+"$', f'  version "{version}"'),
              (r'^  sha256 "[^"]+"$', f'  sha256 "{sha}"'),
          ):
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  sys.exit(f"Cask line not found: {pattern}")
          path.write_text(text)
          PY

          echo "--- updated cask ---"
          cat "$cask"

          # Developer mode turns deprecated cask DSL calls into errors.
          brew info --cask "$cask"
          brew fetch --cask "$cask"

          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Casks/quota-bar.rb
          if git -C "$TAP_DIR" diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -C "$TAP_DIR" commit -m "chore: bump quota-bar to ${version}"

          # The push lands straight on the tap's main, so run the tap CI's checks first. brew tap
          # clones the local checkout, so this runs after the commit.
          brew tap softmaxe/tap "$TAP_DIR"
          brew trust softmaxe/tap
          brew style --cask softmaxe/tap/quota-bar
          brew audit --strict --cask softmaxe/tap/quota-bar

      - name: Push tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(git -C "$TAP_DIR" rev-parse HEAD)" == "$(git -C "$TAP_DIR" rev-parse origin/main)" ]]; then
            echo "Tap is already current"
            exit 0
          fi

          remote="https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/softmaxe/homebrew-tap.git"
          # Handle concurrent pushes to the tap (e.g., other formula bumps) by rebasing and retrying.
          for attempt in 1 2 3; do
            if git -C "$TAP_DIR" push "$remote" HEAD:main; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to push tap after 3 attempts."
              exit 1
            fi
            echo "Push rejected, rebasing tap and retrying (attempt $attempt)..."
            sleep $((attempt * 2))
            git -C "$TAP_DIR" fetch origin main
            git -C "$TAP_DIR" rebase origin/main
          done
