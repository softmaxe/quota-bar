[project]
name = "quotabar-audio"
version = "0.1.0"
description = "Music and sound effects synthesised from the QuotaBar Film timeline."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quotabar_audio"]

[dependency-groups]
dev = ["pytest>=9.1.1", "fonttools>=4.50", "brotli>=1.1"]
