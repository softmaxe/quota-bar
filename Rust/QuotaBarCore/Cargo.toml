[package]
name = "quotabar_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
overflow-checks = true
